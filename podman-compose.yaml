version: "3.0"
services:
  antora:
    image: quay.io/rhpds/antora:v1.3.0
    # Antora's entrypoint always rewrites site.yml at startup (to add or
    # remove the dev-mode extension per ANTORA_ENABLE_DEV_MODE below), which
    # needs write access to this bind-mounted file. Running as root avoids a
    # `podman unshare chown` step on rootless Podman, since root inside the
    # container maps back to the host user that owns these files.
    user: "0:0"
    environment:
      - WAIT_FOR_GIT_CLONER=false
      # Dev mode lists sidebar pages automatically, even before they're added
      # to nav.adoc, and adds an Attributes Page for inspecting
      # content/antora.yml values. Disabled by default -- uncomment to enable.
      # - ANTORA_ENABLE_DEV_MODE=true
      - ANTORA_WATCH=true
    volumes:
      - ./:/files:z
      - www:/output:z

  httpd:
    image: registry.access.redhat.com/ubi10/httpd-24:10.1
    init: true
    ports:
      - "8080:8080"
    volumes:
      - www:/var/www/html:z
    depends_on:
      - antora
    # Apache httpd uses SIGWINCH for graceful shutdown. When running
    # attached (podman compose up), terminal resizes forward SIGWINCH into
    # the container and kill httpd. This wrapper absorbs SIGWINCH while
    # still forwarding SIGTERM so `podman compose down` works normally.
    command: ["/bin/bash", "-c", "trap '' WINCH; trap 'kill -TERM $PID' TERM; run-httpd & PID=$!; wait $PID"]

volumes:
  www:
