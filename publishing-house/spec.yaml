# Publishing House — Project Manifest
# 4-stage lifecycle: intake → review → development → ready
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json

project:
  slug: ""                  # Short identifier (e.g., "ocp-getting-started")
  jira_ticket: ""           # RHDPCD-NNN
  content_type: ""          # lab | demo | workshop | onboarding
  initiative_key: ""        # e.g., summit-2027
  reviewer_email: ""        # Who reviews the spec at the Review gate
  deployment_mode: ""       # rhdp_published | self_published

stage:
  current: intake           # intake | review | development | ready | published
  entered_at: ""

gates: []

spec:
  title: ""
  learning_objectives: []
  modules: []
  environment:
    ocp_version: ""
    topology: ""            # shared-cluster | per-student | cnv-pool
  duration_hours: null
  audience: ""              # beginner | intermediate | advanced

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null
